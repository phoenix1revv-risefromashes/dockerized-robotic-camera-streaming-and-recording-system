[project]
name = "robot-camera-station"
version = "0.1.0"
description = "robot camera streaming and recording system"
authors = [
    {name = "Phoenix"}
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "opencv-python-headless (>=5.0.0.93,<6.0.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)"
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]

[tool.poetry]
packages = [{ include = "robot_camera", from = "src" }]
