name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Poetry in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/poetry"
          "$RUNNER_TEMP/poetry/bin/python" -m pip install "poetry==2.3.2"
          echo "$RUNNER_TEMP/poetry/bin" >> "$GITHUB_PATH"

      - name: Validate project configuration and lock file
        run: poetry check --lock

      - name: Install locked project dependencies
        run: poetry sync --with dev --no-interaction

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Check lint rules
        run: poetry run ruff check .

      - name: Check types
        run: poetry run mypy src tests

      - name: Run tests
        run: poetry run pytest -v


      - name: Audit installed dependencies
        run: poetry run pip-audit --skip-editable

      - name: Build Python package
        run: poetry build
